# The Fadenstack apps and their releases, as Fadenstack servers are told about them.
#
# The workflow app-list.yml turns this file into https://fadenstack.com/updates/v1/apps.json (signed: apps.json.sig)
# with Fadenstack's release/update_feed.py (apps-build, apps-sign, apps-verify). The builder refuses anything a server
# would leave out, so nothing listed here goes missing on the way.
#
# Per app:
#   id            desktop | office | nextcloud | chrome (lower case, digits, -)
#   name          {en: ..., de: ...}: English required; es, fr, zh welcome
#   description   {en: ..., de: ...}: one or two sentences
#   page          its page on fadenstack.com (https)
#   reports_as    the app_name its SDK manifest reports: how a server knows the app is in use
#                 (Office: "Word add-in", "Excel add-in", "PowerPoint add-in", "Outlook add-in";
#                 Chrome: "Chrome extension"; Nextcloud: "Nextcloud Files"; the desktop agent reports none yet)
#   connect       desktop | office | nextcloud | chrome: what the server can fill in to connect it
#   agents        the agent slugs it works for, by role: {default: desktop-assistant}, Office {word: word-assistant, ...}
#   store         its store listing (Chrome Web Store, Nextcloud app store), optional
#   store_id      its id there (the Chrome extension's id: needed for the IT policy the server makes)
#   series        [{series: "0.2", supported_until: 2027-11-30}]: the last day each series gets security fixes.
#                 Servers show it and name versions past it. Only state a day you mean to keep.
#   releases      one entry per release:
#     version          0.2.0, or 0.2.0rc1 for a pre-release (channel: preview)
#     channel          stable | preview
#     date             YYYY-MM-DD
#     severity         normal | security (fixes a security problem) | critical (install now)
#     summary          {en: one line, de: ...}
#     notes_url        optional; default: the app's page + #v<version>
#     requires_server  optional: the oldest Fadenstack release it works with
#     fixes            optional: [{id, severity, summary}] once they may be public
#     files            [{platform, kind, url, sha256, size}]:
#                      platform  windows-x64 | windows-arm64 | linux-x64 | nextcloud | chrome | ...
#                      kind      setup | zip | deb | rpm | appimage | tarball | crx | ...
#                      url       https://github.com/fadenstack/fadenstack-apps/releases/download/<tag>/<file>
#                      sha256    64 lower-case hex digits (from SHA256SUMS); size in bytes
#
# Example (not published until it is moved below `apps:`):
#
#   - id: nextcloud
#     name: {en: Fadenstack for Nextcloud, de: Fadenstack für Nextcloud}
#     description:
#       en: Ask, summarise and change files, calendars, tasks and boards in Nextcloud, with approvals.
#       de: Dateien, Kalender, Aufgaben und Boards in Nextcloud abfragen, zusammenfassen und ändern, mit Freigaben.
#     page: https://fadenstack.com/agents/nextcloud/
#     reports_as: [Nextcloud Files]
#     connect: nextcloud
#     agents: {default: nextcloud-assistant}
#     series: [{series: "0.1", supported_until: 2027-06-30}]
#     releases:
#       - version: 0.1.10
#         channel: preview
#         date: 2026-11-20
#         severity: normal
#         summary: {en: The first preview., de: Die erste Vorschau.}
#         requires_server: 0.7.0
#         files:
#           - platform: nextcloud
#             kind: tarball
#             url: https://github.com/fadenstack/fadenstack-apps/releases/download/nextcloud-v0.1.10/fadenstack_agent-0.1.10.tar.gz
#             sha256: <from SHA256SUMS>
#             size: <bytes>

apps: []
