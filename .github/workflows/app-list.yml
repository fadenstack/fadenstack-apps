# The app list Fadenstack servers read: apps.yaml -> apps.json (+ apps.json.sig) on fadenstack.com/updates/v1/.
#
# Built and checked with Fadenstack's own builder (release/update_feed.py, from the public repository), so what is
# published is what servers read. Signed with APPS_FEED_SIGNING_KEY, a key servers trust for this list only.
# FEED_DEPLOY_SSH_KEY, FEED_DEPLOY_HOST and FEED_DEPLOY_KNOWN_HOSTS put it on fadenstack.com; without them the
# signed files are kept as the run's artifact, to be put there by hand.
name: App list

on:
  push:
    branches: [main]
    paths: [apps.yaml, .github/workflows/app-list.yml]
  # Every day: the list expires 14 days after it is signed (servers then warn that newer releases may be held
  # back from them), so it is signed anew daily even when nothing changed.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-list
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPS_FEED_SIGNING_KEY: ${{ secrets.APPS_FEED_SIGNING_KEY }}
      FEED_DEPLOY_SSH_KEY: ${{ secrets.FEED_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fadenstack's builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fadenstack/fadenstack
          ref: main
          path: core
          persist-credentials: false
          sparse-checkout: |
            release
            cli/src/faden_cli/core
            backend/faden_backend/web/api/install

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build, sign and check the app list
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPS_FEED_SIGNING_KEY" ]; then
            echo "::error::APPS_FEED_SIGNING_KEY is not set: no server would believe the list"
            exit 1
          fi
          pip install pyyaml cryptography packaging
          python core/release/update_feed.py apps-build --source apps.yaml --out out
          python core/release/update_feed.py apps-sign out
          python core/release/update_feed.py apps-verify out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-list
          path: |
            out/apps.json
            out/apps.json.sig

      - name: Put it on fadenstack.com
        if: env.FEED_DEPLOY_SSH_KEY != ''
        shell: bash
        env:
          FEED_DEPLOY_HOST: ${{ secrets.FEED_DEPLOY_HOST }}
          FEED_DEPLOY_KNOWN_HOSTS: ${{ secrets.FEED_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FEED_DEPLOY_SSH_KEY" > ~/.ssh/feed && chmod 600 ~/.ssh/feed
          printf '%s\n' "$FEED_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delay-updates: both files change together, so no server reads the list with another's signature.
          rsync -e "ssh -i $HOME/.ssh/feed -o BatchMode=yes" --delay-updates --chmod=F644 \
            out/apps.json out/apps.json.sig "$FEED_DEPLOY_HOST:v1/"
          curl -fsS https://fadenstack.com/updates/v1/apps.json -o live.json
          cmp live.json out/apps.json

  heartbeat:
    # GitHub switches a public repository's scheduled workflows off after 60 days without activity; the daily
    # signing would stop, and every server would warn 14 days later. A commit counts as activity: after 45 quiet
    # days, one empty commit keeps the schedule alive. (Needs pushes to main by github-actions[bot] allowed.)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keep the schedule alive
        shell: bash
        run: |
          set -euo pipefail
          quiet=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$quiet" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily signing of the app list scheduled ($quiet quiet days)"
            git push
          fi
